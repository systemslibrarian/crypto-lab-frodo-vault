name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # The vitest suite: FrodoKEM encaps/decaps, the lattice math and the
      # teaching exhibits — 53 tests across 3 files. Deploy previously ran
      # only test:a11y, so none of it gated a publish: a build whose KEM no
      # longer agreed on a shared secret could ship as long as the page
      # passed axe.
      - name: Unit tests
        run: npm test

      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y

      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
